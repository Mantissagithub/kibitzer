[project]
name = "kibitzer"
version = "0.0.0"
description = "Chess kibitzer."
requires-python = ">=3.11"
dependencies = [
    "torch",
    "python-chess",
    "numpy",
    "chess>=1.11.2",
    "rich>=13.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "rich-pixels>=3.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
dev = ["pytest"]
wandb = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kibitzer"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[tool.pytest.ini_options]
testpaths = ["tests"]
