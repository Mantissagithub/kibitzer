<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" role="img" aria-label="Kibitzer architecture diagram">
  <defs>
    <style>
      .card     { fill: #ffffff; stroke: #d6dbe3; stroke-width: 1.4; }
      .card-a   { fill: #eef2ff; stroke: #93a6e6; stroke-width: 1.4; }
      .card-b   { fill: #ecfdf5; stroke: #6fc8a7; stroke-width: 1.4; }
      .title    { font: 600 16px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f1419; }
      .sub      { font: 400 12.5px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #5b6473; }
      .tag      { font: 500 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #6b7280; letter-spacing: 0.04em; text-transform: uppercase; }
      .arrow    { stroke: #98a0ac; stroke-width: 1.5; fill: none; }
      .frame    { fill: #fafbfc; stroke: #e5e8ee; stroke-width: 1; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#98a0ac"/>
    </marker>
  </defs>

  <rect class="frame" x="8" y="8" width="744" height="684" rx="14"/>

  <!-- Input -->
  <text class="tag" x="380" y="46" text-anchor="middle">input</text>
  <rect class="card" x="140" y="58" width="480" height="76" rx="10"/>
  <text class="title" x="380" y="86" text-anchor="middle">Board state</text>
  <text class="sub"   x="380" y="108" text-anchor="middle">64 square tokens · 7 aux features</text>
  <text class="sub"   x="380" y="124" text-anchor="middle">side to move · castling · en-passant · halfmove</text>

  <path class="arrow" d="M 380 138 L 380 168" marker-end="url(#ah)"/>

  <!-- Position encoder -->
  <rect class="card-a" x="200" y="176" width="360" height="56" rx="10"/>
  <text class="title" x="380" y="202" text-anchor="middle">PositionEncoder</text>
  <text class="sub"   x="380" y="220" text-anchor="middle">per-square embeddings + aux fusion</text>

  <path class="arrow" d="M 380 234 L 380 264" marker-end="url(#ah)"/>

  <!-- Bidirectional encoder -->
  <rect class="card-a" x="200" y="272" width="360" height="56" rx="10"/>
  <text class="title" x="380" y="298" text-anchor="middle">Bidirectional Square Encoder</text>
  <text class="sub"   x="380" y="316" text-anchor="middle">64 squares → 1 timeline token per board</text>

  <path class="arrow" d="M 380 330 L 380 360" marker-end="url(#ah)"/>

  <!-- Trunk -->
  <text class="tag" x="380" y="380" text-anchor="middle">sequence model</text>
  <rect class="card" x="140" y="392" width="480" height="96" rx="10"/>
  <text class="title" x="380" y="420" text-anchor="middle">Causal Llama-style Transformer Trunk</text>
  <text class="sub"   x="380" y="444" text-anchor="middle">RMSNorm · Rotary Positional Embeddings · SwiGLU MLPs</text>
  <text class="sub"   x="380" y="462" text-anchor="middle">PyTorch scaled dot-product attention over the game sequence</text>

  <!-- Branching arrows -->
  <path class="arrow" d="M 380 488 L 380 514"/>
  <path class="arrow" d="M 230 514 L 530 514"/>
  <path class="arrow" d="M 230 514 L 230 548" marker-end="url(#ah)"/>
  <path class="arrow" d="M 530 514 L 530 548" marker-end="url(#ah)"/>

  <!-- Heads -->
  <text class="tag" x="230" y="566" text-anchor="middle">policy</text>
  <rect class="card-b" x="120" y="576" width="220" height="76" rx="10"/>
  <text class="title" x="230" y="604" text-anchor="middle">Policy Head</text>
  <text class="sub"   x="230" y="624" text-anchor="middle">4,672 AlphaZero-style moves</text>
  <text class="sub"   x="230" y="640" text-anchor="middle">64 × 73 (from-square × move-type)</text>

  <text class="tag" x="530" y="566" text-anchor="middle">value</text>
  <rect class="card-b" x="420" y="576" width="220" height="76" rx="10"/>
  <text class="title" x="530" y="604" text-anchor="middle">Value Head</text>
  <text class="sub"   x="530" y="624" text-anchor="middle">bounded scalar via tanh</text>
  <text class="sub"   x="530" y="640" text-anchor="middle">outcome estimate ∈ (-1, 1)</text>
</svg>
