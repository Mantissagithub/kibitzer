<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Kibitzer transformer architecture</title>
  <desc id="desc">A block diagram of the Kibitzer chess transformer: game history positions are encoded with a 64-square bidirectional position encoder, passed through a 12-layer causal transformer trunk, then split into policy and value heads.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#20242c"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1c5f82"/>
    </marker>
    <style>
      .bg { fill: #f7f6f1; }
      .title { font: 700 38px Arial, sans-serif; fill: #20242c; letter-spacing: 0; }
      .subtitle { font: 400 19px Arial, sans-serif; fill: #5d6470; letter-spacing: 0; }
      .label { font: 700 22px Arial, sans-serif; fill: #20242c; letter-spacing: 0; }
      .small { font: 400 16px Arial, sans-serif; fill: #343b45; letter-spacing: 0; }
      .tiny { font: 400 14px Arial, sans-serif; fill: #4f5965; letter-spacing: 0; }
      .mono { font: 600 15px "DejaVu Sans Mono", Consolas, monospace; fill: #20242c; letter-spacing: 0; }
      .box { stroke: #20242c; stroke-width: 2.5; rx: 8; ry: 8; }
      .thin { stroke: #20242c; stroke-width: 1.8; rx: 6; ry: 6; }
      .input { fill: #e9edf3; }
      .embed { fill: #f8dfbf; }
      .encoder { fill: #dbeecf; }
      .trunk { fill: #d4eaf1; }
      .head { fill: #f2d3cf; }
      .loss { fill: #eee4f4; }
      .note { fill: #fffdf7; stroke: #b7ad98; stroke-width: 1.8; rx: 8; ry: 8; }
      .arrow { stroke: #20242c; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #1c5f82; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .dash { stroke: #5d6470; stroke-width: 1.8; fill: none; stroke-dasharray: 7 7; }
      .chip { fill: #ffffff; stroke: #20242c; stroke-width: 1.4; rx: 5; ry: 5; }
      .lane { fill: #ffffff; stroke: #c7c3b8; stroke-width: 1.4; rx: 10; ry: 10; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>

  <text class="title" x="70" y="72">Kibitzer Transformer Architecture</text>
  <text class="subtitle" x="72" y="108">History-dependent chess policy/value net: encode each board, run causal attention over time, predict move logits and value.</text>

  <rect class="note" x="1140" y="44" width="365" height="118"/>
  <text class="label" x="1162" y="80">Default config</text>
  <text class="mono" x="1162" y="110">d_model=384  heads=8</text>
  <text class="mono" x="1162" y="134">encoder_layers=3</text>
  <text class="mono" x="1332" y="134">trunk_layers=12</text>

  <rect class="lane" x="55" y="190" width="1490" height="265"/>
  <text class="label" x="78" y="226">Per-position encoder, applied to every board in the history</text>

  <rect class="box input" x="90" y="270" width="190" height="100"/>
  <text class="label" x="118" y="304">Board x_t</text>
  <text class="small" x="118" y="332">64 squares</text>
  <text class="tiny" x="118" y="356">piece ids: 13 classes</text>

  <rect class="box input" x="90" y="382" width="190" height="48"/>
  <text class="small" x="123" y="412">aux features: 7</text>

  <path class="arrow" d="M280 320 H360"/>
  <path class="arrow" d="M280 406 H360"/>

  <rect class="box embed" x="360" y="262" width="250" height="176"/>
  <text class="label" x="388" y="300">Token build</text>
  <rect class="chip" x="390" y="322" width="178" height="32"/>
  <text class="tiny" x="407" y="343">piece embedding</text>
  <rect class="chip" x="390" y="362" width="178" height="32"/>
  <text class="tiny" x="404" y="383">square embedding</text>
  <rect class="chip" x="390" y="402" width="178" height="32"/>
  <text class="tiny" x="408" y="423">aux projection</text>

  <path class="arrow" d="M610 350 H695"/>

  <rect class="box encoder" x="695" y="246" width="330" height="210"/>
  <text class="label" x="728" y="284">Square encoder x3</text>
  <text class="small" x="728" y="317">64 bidirectional square tokens</text>
  <rect class="chip" x="730" y="340" width="255" height="32"/>
  <text class="tiny" x="751" y="361">RMSNorm + self-attention</text>
  <rect class="chip" x="730" y="382" width="255" height="32"/>
  <text class="tiny" x="772" y="403">RMSNorm + SwiGLU</text>
  <text class="tiny" x="728" y="438">No causal mask here; one board only.</text>

  <path class="arrow" d="M1025 350 H1110"/>

  <rect class="box encoder" x="1110" y="284" width="210" height="132"/>
  <text class="label" x="1144" y="322">Pool</text>
  <text class="small" x="1144" y="352">RMSNorm</text>
  <text class="small" x="1144" y="378">mean over 64</text>
  <text class="mono" x="1144" y="403">h_t in R^384</text>

  <path class="arrow-blue" d="M1320 350 C1380 350, 1380 500, 1330 528"/>

  <rect class="lane" x="55" y="505" width="1490" height="260"/>
  <text class="label" x="78" y="541">Causal timeline trunk over board history</text>

  <rect class="box input" x="95" y="596" width="250" height="96"/>
  <text class="label" x="124" y="632">History sequence</text>
  <text class="mono" x="124" y="660">[h_1, ..., h_T]</text>
  <text class="tiny" x="124" y="684">current training uses short context</text>

  <path class="arrow" d="M345 644 H430"/>

  <rect class="box trunk" x="430" y="560" width="410" height="168"/>
  <text class="label" x="465" y="596">Causal transformer block x12</text>
  <rect class="chip" x="470" y="620" width="318" height="32"/>
  <text class="tiny" x="492" y="641">RMSNorm + causal MHA + RoPE</text>
  <rect class="chip" x="470" y="662" width="318" height="32"/>
  <text class="tiny" x="544" y="683">RMSNorm + SwiGLU</text>
  <text class="tiny" x="465" y="716">Only attends to earlier boards in the line.</text>

  <path class="arrow" d="M840 644 H925"/>

  <rect class="box trunk" x="925" y="596" width="210" height="96"/>
  <text class="label" x="964" y="632">Final norm</text>
  <text class="mono" x="964" y="662">H in R^{T x 384}</text>

  <path class="arrow" d="M1135 644 H1220"/>

  <rect class="box head" x="1220" y="542" width="245" height="84"/>
  <text class="label" x="1250" y="576">Policy head</text>
  <text class="mono" x="1250" y="604">Linear 384 -> 4672</text>

  <rect class="box head" x="1220" y="664" width="245" height="84"/>
  <text class="label" x="1250" y="698">Value head</text>
  <text class="mono" x="1250" y="726">GELU -> tanh scalar</text>

  <path class="arrow" d="M1135 644 C1178 644, 1178 584, 1220 584"/>
  <path class="arrow" d="M1135 644 C1178 644, 1178 706, 1220 706"/>

  <rect class="lane" x="55" y="815" width="1490" height="105"/>
  <text class="label" x="78" y="850">Current dense-label training objective</text>
  <rect class="box loss" x="355" y="838" width="360" height="58"/>
  <text class="mono" x="382" y="873">CE(q_teacher, p_theta)</text>
  <rect class="box loss" x="758" y="838" width="300" height="58"/>
  <text class="mono" x="786" y="873">(tanh(v_theta) - y)^2</text>
  <rect class="box loss" x="1100" y="838" width="280" height="58"/>
  <text class="mono" x="1128" y="873">L = policy + value</text>
  <path class="arrow" d="M715 867 H758"/>
  <path class="arrow" d="M1058 867 H1100"/>

  <path class="dash" d="M1342 626 V838"/>
  <path class="dash" d="M1342 748 V838"/>
  <text class="tiny" x="1212" y="810">policy/value outputs feed the supervised loss</text>

  <text class="tiny" x="72" y="955">Diagram generated from kibitzer/model.py, kibitzer/position_encoder.py, and kibitzer/transformer.py. It shows the default architecture, not a training timeline.</text>
</svg>
